spring.application.name=banco-alimentos-recife-api
# Perfil padrao: dev (H2 em arquivo). Em producao, ative outro perfil e informe as variaveis de ambiente.
spring.profiles.default=dev
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never

# Limite de requisicoes por IP, por minuto
app.rate-limit.consulta-por-minuto=30
app.rate-limit.criacao-por-minuto=10
app.rate-limit.equipe-por-minuto=120
